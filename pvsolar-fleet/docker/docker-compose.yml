version: '3.8'

services:
  pvsolar-fleet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pvsolar-fleet
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ../config:/app/config:ro
      - fleet-data:/app/data
    environment:
      - PVFLEET_DEBUG=false
      - API_PORT=8003
    networks:
      - pvsolar-net

volumes:
  fleet-data:

networks:
  pvsolar-net:
    driver: bridge

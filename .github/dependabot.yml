# ============================================================
# pvSolar - Dependabot: alertas + PRs automaticos de atualizacao
# - pip: 12 projetos Python (requisitos em pvsolar-*/requirements.txt)
# - npm: pvsolar-web
# - github-actions: pins das actions nesta propria CI
#
# Politica:
# - Atualizacoes minor/patch sao agrupadas em 1 PR/semana por
#   ecossistema (validados juntos pela CI inteira).
# - MAJOR versions sao ignoradas: migracoes de framework (next 14->16,
#   typescript 5->7, pydantic 2->3, tailwind 3->4...) sao decisoes
#   deliberadas, nao bumps automaticos. Um major agrupado quebrou o
#   npm uma vez (ERESOLVE ts-jest x typescript 7) e travaria qualquer
#   outro update do grupo junto.
# - github-actions mantem majors: sao compatibilizados pela propria CI
#   (checkout v4->v5 resolve o deprecation de Node 20) e de baixo risco.
# ============================================================
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/pvsolar-gateway"
      - "/pvsolar-analytics"
      - "/pvsolar-scada"
      - "/pvsolar-reports"
      - "/pvsolar-fleet"
      - "/pvsolar-alert"
      - "/pvsolar-grid"
      - "/pvsolar-twin"
      - "/pvsolar-auth"
      - "/pvsolar-backup"
      - "/pvsolar-scheduler"
      - "/pvsolar-exporter"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "npm"
    directory: "/pvsolar-web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "javascript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"

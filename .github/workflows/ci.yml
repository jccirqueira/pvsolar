name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validadores:
    name: Validadores (compose, guia, manuals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install pyyaml
      - name: Validar docker-compose
        run: python docker/validate_compose.py
      - name: Validar guia (HTML)
        run: python docker/validate_guide.py
      - name: Validar 13 manuals (HTML)
        run: python docker/validate_manuals.py

  testes-python:
    name: pytest ${{ matrix.projeto }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        projeto:
          - pvsolar-gateway
          - pvsolar-analytics
          - pvsolar-scada
          - pvsolar-reports
          - pvsolar-fleet
          - pvsolar-alert
          - pvsolar-grid
          - pvsolar-twin
          - pvsolar-auth
          - pvsolar-backup
          - pvsolar-scheduler
          - pvsolar-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        working-directory: ${{ matrix.projeto }}
        run: pip install -r requirements.txt
      - name: Testes
        working-directory: ${{ matrix.projeto }}
        run: python -m pytest tests/ -q

  testes-web:
    name: jest pvsolar-web
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pvsolar-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pvsolar-web/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Testes
        run: npm test

  docker-build:
    name: Docker build (14 imagens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe do compose
        run: docker compose config -q
      - name: Build das imagens
        run: docker compose build

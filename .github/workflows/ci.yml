name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validadores:
    name: Validadores (compose, guia, manuals)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install pyyaml
      - name: Validar docker-compose
        run: python docker/validate_compose.py
      - name: Validar guia (HTML)
        run: python docker/validate_guide.py
      - name: Validar 13 manuals (HTML)
        run: python docker/validate_manuals.py
      - name: Validar links relativos dos Markdown
        run: python docker/validate_md_links.py

  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar ruff (pinado = mesmo da dev local)
        run: pip install ruff==0.16.7
      - name: Ruff check (monorepo)
        run: ruff check .
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pvsolar-web/package-lock.json
      - name: ESLint (pvsolar-web)
        working-directory: pvsolar-web
        run: |
          npm ci
          npm run lint

  testes-python:
    name: pytest ${{ matrix.projeto }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projeto:
          - pvsolar-gateway
          - pvsolar-analytics
          - pvsolar-scada
          - pvsolar-reports
          - pvsolar-fleet
          - pvsolar-alert
          - pvsolar-grid
          - pvsolar-twin
          - pvsolar-auth
          - pvsolar-backup
          - pvsolar-scheduler
          - pvsolar-exporter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.projeto }}/requirements.txt
      - name: Dependencias
        working-directory: ${{ matrix.projeto }}
        run: pip install -r requirements.txt
      - name: Testes
        working-directory: ${{ matrix.projeto }}
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing

  testes-web:
    name: jest pvsolar-web
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pvsolar-web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pvsolar-web/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Testes
        run: npm test -- --coverage

  docker-build:
    name: Docker build + smoke E2E (13 imagens)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validar sintaxe do compose
        run: docker compose config -q
      - name: Validar sintaxe dos composes dev (gateway e scada)
        run: |
          docker compose -f pvsolar-gateway/docker/docker-compose.yml config -q
          docker compose -f pvsolar-scada/docker/docker-compose.yml config -q
      - name: Validar Caddyfile (caddy validate)
        run: |
          # Mesmo default do compose (http://localhost = HTTP puro na 80);
          # pega regressoes de sintaxe do Caddyfile antes do build longo.
          docker run --rm -e DOMAIN=http://localhost \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Build das imagens (uma a uma, com atribuicao de falha)
        shell: bash
        run: |
          failed=""
          for svc in gateway analytics reports fleet alert grid twin auth backup scheduler exporter scada web; do
            echo "::group::build ${svc}"
            if ! docker compose build "${svc}"; then
              echo "::error::Build falhou no servico: ${svc}"
              failed="${failed} ${svc}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "Servicos com falha:${failed}"
            exit 1
          fi
      - name: "Smoke E2E: subir a stack (imagens ja buildadas)"
        run: docker compose up -d --wait --wait-timeout 300
      - name: "Smoke E2E: estado dos containers + probes HTTP"
        shell: bash
        run: |
          echo "== docker compose ps --all =="
          docker compose ps --all
          unhealthy="$(docker compose ps --status unhealthy -q)"
          exited="$(docker compose ps --status exited -q)"
          restarting="$(docker compose ps --status restarting -q)"
          if [ -n "${unhealthy}" ]; then
            echo "::error::Containers unhealthy: ${unhealthy}"
            exit 1
          fi
          if [ -n "${exited}" ]; then
            echo "::error::Containers exitados: ${exited}"
            exit 1
          fi
          if [ -n "${restarting}" ]; then
            echo "::error::Containers em restart loop: ${restarting}"
            exit 1
          fi
          echo "== probes HTTP (caddy primeiro: porta de entrada) =="
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors http://localhost:80 >/dev/null
          echo "caddy :80 -> web OK"
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors http://localhost:8000/api/health >/dev/null
          echo "gateway :8000 /api/health OK"
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors http://localhost:3001 >/dev/null
          echo "web :3001 OK"
      - name: "Smoke E2E: auth MQTT (credenciais autorizam, anonimo e recusado)"
        shell: bash
        run: |
          echo "== publicar COM credenciais deve autorizar =="
          docker compose exec -T mosquitto mosquitto_pub -h 127.0.0.1 \
            -u pvsolar -P pvsolar_dev -t pvsolar/ci -m ok
          echo "auth com credenciais OK"
          echo "== publicar SEM credenciais deve ser recusado =="
          if docker compose exec -T mosquitto mosquitto_pub -h 127.0.0.1 \
            -t pvsolar/ci -m anon >/dev/null 2>&1; then
            echo "::error::mosquitto aceitou conexao anonima (allow_anonymous deveria ser false)"
            exit 1
          fi
          echo "anonimo recusado OK"
      - name: "Smoke E2E: logs (diagnostico em caso de falha)"
        if: failure()
        shell: bash
        run: |
          echo "::group::docker compose ps --all"
          docker compose ps --all
          echo "::endgroup::"
          echo "::group::docker compose logs --tail 300"
          docker compose logs --tail 300
          echo "::endgroup::"
          echo "::group::logs COMPLETOS do caddy (sem tail: preserva o 1o erro)"
          docker logs pvsolar-caddy 2>&1 || true
          echo "::endgroup::"
          echo "::group::estado do caddy"
          docker inspect pvsolar-caddy --format '{{json .State}}' || true
          echo "::endgroup::"
      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validadores:
    name: Validadores (compose, guia, manuals)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: pip install pyyaml
      - name: Validar docker-compose
        run: python docker/validate_compose.py
      - name: Validar guia (HTML)
        run: python docker/validate_guide.py
      - name: Validar 13 manuals (HTML)
        run: python docker/validate_manuals.py

  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ruff (pinado = mesmo da dev local)
        run: pip install ruff==0.16.7
      - name: Ruff check (monorepo)
        run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pvsolar-web/package-lock.json
      - name: ESLint (pvsolar-web)
        working-directory: pvsolar-web
        run: |
          npm ci
          npm run lint

  testes-python:
    name: pytest ${{ matrix.projeto }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        projeto:
          - pvsolar-gateway
          - pvsolar-analytics
          - pvsolar-scada
          - pvsolar-reports
          - pvsolar-fleet
          - pvsolar-alert
          - pvsolar-grid
          - pvsolar-twin
          - pvsolar-auth
          - pvsolar-backup
          - pvsolar-scheduler
          - pvsolar-exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.projeto }}/requirements.txt
      - name: Dependencias
        working-directory: ${{ matrix.projeto }}
        run: pip install -r requirements.txt
      - name: Testes
        working-directory: ${{ matrix.projeto }}
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing

  testes-web:
    name: jest pvsolar-web
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pvsolar-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pvsolar-web/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Testes
        run: npm test -- --coverage

  docker-build:
    name: Docker build (13 imagens)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe do compose
        run: docker compose config -q
      - name: Build das imagens (uma a uma, com atribuicao de falha)
        shell: bash
        run: |
          failed=""
          for svc in gateway analytics reports fleet alert grid twin auth backup scheduler exporter scada web; do
            echo "::group::build ${svc}"
            if ! docker compose build "${svc}"; then
              echo "::error::Build falhou no servico: ${svc}"
              failed="${failed} ${svc}"
            fi
            echo "::endgroup::"
          done
          if [ -n "${failed}" ]; then
            echo "Servicos com falha:${failed}"
            exit 1
          fi

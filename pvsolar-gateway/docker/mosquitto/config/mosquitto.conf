# Mosquitto Configuration for pvSolar Gateway
# =============================================
# Security-hardened configuration for industrial IoT

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# Listener 1: MQTT over TLS (Port 8883) - PRIMARY
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate true
use_identity_as_username true

# Listener 2: MQTT with username/password (Port 1883) - FALLBACK
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/password.txt

# Listener 3: WebSocket (Port 9001) - OPTIONAL
listener 9001
protocol websockets

# Connection limits
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 0

# Timeout settings
keepalive_interval 60
max_keepalive 120

# Topic ACLs
acl_file /mosquitto/config/acl.txt

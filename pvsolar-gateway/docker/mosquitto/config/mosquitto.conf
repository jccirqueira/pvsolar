# Mosquitto Configuration for pvSolar Gateway
# =============================================
# Broker local de desenvolvimento com autenticacao por senha.
#
# Senhas: password.txt (mosquitto_passwd -b -c, usuario pvsolar,
#   senha pvsolar_dev - mesma credencial que envia o config local
#   do gateway em config/gateway.yaml). O allow_anonymous e GLOBAL
#   (per_listener_settings padrao false), portanto vale para todos
#   os listeners.
# ACL: acl.txt restringe topicos por padrao/usuario.
# TLS (8883) nao e provisionado aqui: o TLS do ecossistema e o do
#   Caddy na borda (compose da raiz) - nao ha ciclo de vida de
#   certificado dev neste stack.

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# Listener 1: MQTT (Porta 1883) - autenticado
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/password.txt

# Listener 2: WebSocket (Porta 9001) - opcional (autenticacao global acima)
listener 9001
protocol websockets

# Connection limits
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
max_queued_bytes 0

# Timeout settings
keepalive_interval 60
max_keepalive 120

# Topic ACLs
acl_file /mosquitto/config/acl.txt

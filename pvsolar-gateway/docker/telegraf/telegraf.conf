# Telegraf - pvSolar Gateway (stack de desenvolvimento)
# ======================================================
# Pipeline: MQTT (Mosquitto) -> InfluxDB v2 -> Grafana.
# O Grafana provisiona os datasources em
#   grafana/provisioning/datasources/datasources.yml
#
# Variaveis (com padrao, sobrescreviveis no docker-compose):
#   MOSQUITTO_URL  broker MQTT (no compose: tcp://mosquitto:1883)
#   INFLUX_URL     InfluxDB v2   (no compose: http://influxdb:8086)
#
# Autenticacao no Mosquitto: usuario pvsolar / pvsolar_dev (mesmas
# credenciais do gateway; o ACL de padrao permite a leitura de
# pvsolar/+/telemetry e pvsolar/+/status).

[agent]
  interval = "10s"
  round_interval = true
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  hostname = "telegraf-dev"

# As variaveis abaixo sao definidas no docker-compose (com defaults).
[[inputs.mqtt_consumer]]
  servers = ["${MOSQUITTO_URL}"]
  username = "pvsolar"
  password = "pvsolar_dev"
  topics = [
    "pvsolar/+/telemetry",
    "pvsolar/+/status"
  ]
  data_format = "json"
  json_time_key = ""
  name_override = "mqtt_telemetry"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "pvsolar"
  bucket = "pvsolar"

# pvSolar Grid Configuration
# Copy this file to grid.yaml and customize

# Grid Connection
connection:
  nominal_voltage_kv: 13.8
  nominal_frequency: 60.0
  voltage_level: "medium"
  max_power_kw: 1000.0
  min_power_kw: 0.0
  power_factor_range: [0.9, 1.0]
  reactive_power_range_kvar: [-200.0, 200.0]

# PRODIST Limits
prodist:
  voltage_min_pu: 0.9
  voltage_max_pu: 1.1
  thd_v_max: 8.0
  thd_i_max: 5.0
  power_factor_min: 0.925
  frequency_min: 59.5
  frequency_max: 60.5
  flicker_pst_max: 1.0
  unbalance_max: 2.0

# FRT Configuration
rtu:
  enabled: true
  lvrt_curve:
    - time_ms: 0.0
      voltage_pu: 0.0
      description: "Início da falha"
    - time_ms: 150.0
      voltage_pu: 0.0
      description: "Mínimo permitido"
    - time_ms: 600.0
      voltage_pu: 0.9
      description: "Recuperação"
  hvrt_curve:
    - time_ms: 0.0
      voltage_pu: 1.3
      description: "Pico máximo"
    - time_ms: 100.0
      voltage_pu: 1.2
      description: "Tolerância curta"
    - time_ms: 500.0
      voltage_pu: 1.1
      description: "Limite contínuo"
  reconnect_time_ms: 2000.0
  max_voltage_sag_pu: 0.5

# Standards
standards:
  - "prodist"

# Database
database:
  path: "data/grid.db"

# API
api:
  host: "0.0.0.0"
  port: 8005
  title: "pvSolar Grid API"

# Logging
logging:
  level: "INFO"
  format: "json"

# Company
company_name: "pvSolar Grid"
site_id: "site_1"

# Debug Mode
debug: false

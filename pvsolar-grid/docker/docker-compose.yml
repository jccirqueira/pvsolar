version: '3.8'

services:
  pvsolar-grid:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pvsolar-grid
    restart: unless-stopped
    ports:
      - "8005:8005"
    volumes:
      - ../config:/app/config:ro
      - grid-data:/app/data
    environment:
      - PVGRID_DEBUG=false
      - API_PORT=8005
    networks:
      - pvsolar-net

volumes:
  grid-data:

networks:
  pvsolar-net:
    driver: bridge

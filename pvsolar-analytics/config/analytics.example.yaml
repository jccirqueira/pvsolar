# pvSolar Analytics Configuration Example

mqtt:
  broker: "mqtt.example.com"
  port: 8883
  use_tls: true
  tls_enabled: true
  ca_cert: "/etc/pvsolar/certs/ca.pem"
  client_cert: "/etc/pvsolar/certs/client.pem"
  client_key: "/etc/pvsolar/certs/client.key"
  client_id: "pvsolar-analytics-001"
  username: "analytics"
  password: "secure_password"
  subscribe_topics:
    - "pvsolar/+/telemetry/+"
    - "pvsolar/+/status"
    - "pvsolar/+/alert"
  qos: 1
  reconnect_delay: 5

database:
  url: "postgresql+asyncpg://analytics:password@localhost:5432/pvsolar_analytics"
  pool_size: 10
  echo: false

redis:
  url: "redis://localhost:6379/0"

ml:
  model_dir: "./ml_models"
  anomaly:
    contamination: 0.05
    threshold: 0.8
    retrain_interval_hours: 168
  maintenance:
    prediction_horizons: [7, 30, 90]
    retrain_interval_hours: 168
  forecast:
    horizon_hours: 168
    confidence_level: 0.95

alerts:
  enabled: true
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    from_addr: ""
    to_addrs: []

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

web:
  enabled: true
  dashboard_port: 8001

worker:
  enabled: true
  concurrency: 4

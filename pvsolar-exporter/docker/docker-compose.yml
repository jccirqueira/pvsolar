version: '3.8'

services:
  pvsolar-exporter:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pvsolar-exporter
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      - ../config:/app/config:ro
    environment:
      - PVSOLAR_EXPORTER_DEBUG=false
      - API_PORT=8010
    networks:
      - pvsolar-net

networks:
  pvsolar-net:
    driver: bridge

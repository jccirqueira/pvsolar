# [Docker] Variante para o docker-compose.yml da raiz - rede interna do compose.
# Gerada a partir do YAML de origem do projeto; nao edite URLs locais aqui.

# pvSolar Gateway Configuration
# =============================
# Configuracao real do ecossistema pvSolar (porta 8000).
# Gerada a partir de gateway.example.yaml - ajuste para o seu ambiente.
#
# Em Docker use a variante docker/config/gateway.yaml (broker "mosquitto"),
# montada pelo docker-compose.yml da raiz.

# Gateway Core Settings
gateway:
  name: "solar-site-001"           # Unique gateway identifier
  location: "Sao Paulo, Brazil"    # Physical location
  timezone: "America/Sao_Paulo"    # Timezone (IANA format)
  instance_id: null                # Auto-generated if null

# MQTT Configuration (obrigatorio: o gateway conecta ao broker no startup)
# Broker do stack raiz exige autenticacao (allow_anonymous false) -
# credenciais em docker/mosquitto-passwd (ver docker/mosquitto.conf).
mqtt:
  broker: "mosquitto"
  port: 1883
  use_tls: false
  tls:
    enabled: false
    ca_cert: ""
    client_cert: ""
    client_key: ""
    tls_version: "1.3"
    verify_certificate: false
  client_id: "pvsolar-gateway-001"
  username: "pvsolar"
  password: "pvsolar_dev"
  topics:
    publish: "pvsolar/{site_id}/telemetry"
    command: "pvsolar/{site_id}/command"
    status: "pvsolar/{site_id}/status"
    alert: "pvsolar/{site_id}/alert"
  qos: 1
  retain: true
  heartbeat_interval: 30
  reconnect_delay: 5
  max_inflight: 20
  max_queued: 1000

# Inverters Configuration
# Lista vazia no padrao: adicione os inversores reais (modbus_tcp) do site.
inverters: []

# Cloud Integration
cloud:
  aws_iot:
    enabled: false
    endpoint: ""
    cert_path: "/etc/pvsolar/certs/aws/"
    thing_name: "pvsolar-gateway-001"
    region: "us-east-1"

  azure_iot:
    enabled: false
    connection_string: ""
    device_id: "pvsolar-gateway-001"

  mqtt_local:
    enabled: false
    broker: "mosquitto"
    port: 1883

# Edge Computing (desativado no padrao - requer /var/lib/pvsolar)
edge:
  store_and_forward:
    enabled: false
    database: "./edge.db"
    max_buffer_hours: 72
    sync_interval: 30
    max_records: 100000

  processing:
    enabled: false
    aggregation: "1min"
    calculators:
      - "performance_ratio"
      - "availability"
      - "energy_forecast"

# pvbrowser Integration (desativado no padrao - requer pvBrowser desktop)
pvbrowser:
  enabled: false
  socket_port: 5050
  shared_memory: true
  update_interval: 1.0

# Web Dashboard (API do gateway - porta do ecossistema: 8000)
web:
  enabled: true
  port: 8000
  host: "0.0.0.0"
  auth:
    enabled: false
    username: "admin"
    password_hash: ""
    jwt_secret: ""
    jwt_expiry_hours: 24

# Alerts (Premium)
alerts:
  enabled: false
  channels:
    telegram:
      enabled: false
      bot_token: ""
      chat_id: ""
    whatsapp:
      enabled: false
    sms:
      enabled: false

# Logging (stdout - o Docker coleta via `docker logs`)
logging:
  level: "INFO"
  file: ""
  max_size_mb: 100
  backup_count: 10
  format: "json"

# Prometheus Metrics
metrics:
  enabled: true
  port: 9090

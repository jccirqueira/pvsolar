# Mosquitto do ecossistema pvSolar (autenticacao por senha).
#
# Senha: docker/mosquitto-passwd (hash PBKDF2-SHA512, gerado com
#   mosquitto_passwd -b -c docker/mosquitto-passwd pvsolar <senha>).
# Para trocar: gere o novo hash E atualize username/password em
#   docker/config/gateway.yaml, docker/config/analytics.yaml e
#   docker/config/scada.yaml (os clientes enviam as credenciais).
# A porta 1883 e publicada apenas em 127.0.0.1 (ver compose).
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pvsolar-backup"
version = "1.0.0"
description = "pvSolar Backup - Automated Backup & Restore for Solar Plants"
readme = "Resumo.txt"
license = "GPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "pvSolar Team" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=23.2.0",
    "httpx>=0.25.0",
    "croniter>=1.4.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["src*"]
